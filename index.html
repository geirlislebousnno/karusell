<script>
(() => {
  const T = {
    nb: {
      docTitle: 'Ballkast på karusellen – corioliseffekten i et roterende hjul',
      title: 'Ballkast på karusellen',
      lede: 'En person står på kanten av et roterende hjul (radius 5 m) og triller en ball rett mot sentrum. Sett fra bakken går ballen i en rett linje. Sett fra hjulet bøyer banen av, fordi hjulet dreier seg under ballen mens den er underveis.',
      gTag: 'Treghetssystem', gTitle: 'Sett fra bakken', gAria: 'Hjulet sett ovenfra fra bakken. Hjulet roterer, og ballen går i en rett linje.',
      wTag: 'Roterende system', wTitle: 'Sett fra hjulet', wAria: 'Hjulet sett fra en som står på det. Hjulet står stille, og ballens spor bøyer av.',
      legPath: 'Ballens bane over bakken', legTraceRot: 'Sporet på hjulet (roterer med)', legTrace: 'Sporet på hjulet', legAim: 'Siktelinje fra kasteren',
      settings: 'Innstillinger', readings: 'Måleverdier',
      omegaL: 'Vinkelhastighet ω', omegaH: 'Positiv verdi betyr rotasjon mot klokka. Endringen gjelder fra neste kast.',
      ccw: 'mot klokka', cw: 'med klokka', still: 'i ro',
      speedL: 'Kastefart relativt til hjulet',
      aimL: 'Siktevinkel', aimH: '0° er rett mot sentrum. Prøv å sikte slik at ballen treffer sentrum.',
      left: 'mot venstre', right: 'mot høyre', straight: 'rett frem',
      slowL: 'Avspillingsfart', keep: 'Behold tidligere spor',
      throw: 'Kast ballen', pause: 'Pause', resume: 'Fortsett', clear: 'Fjern spor',
      rT: 'Tid siden kast', rV: 'Ballens fart over bakken', rRim: 'Kanthastighet ωR', rCor: 'Corioliskraft per kg, 2ωv', rMiss: 'Nærmeste avstand til sentrum',
      explain: 'Når ballen slippes, har den både kastefarten innover og kantens fart sidelengs (<b>ωR</b>). Over bakken går den derfor skrått og rett frem. Sett fra hjulet ser det ut som en sidekraft, <b>corioliskraften</b>, bøyer banen. Den virker mot kasterens høyre side når hjulet roterer mot klokka, slik som på den nordlige halvkule.',
      by: 'Laget av Geir Lislebo', lic: 'Lisens:', licUrl: 'https://creativecommons.org/licenses/by/4.0/deed.no',
      dec: ','
    },
    en: {
      docTitle: 'Throwing a ball on a merry-go-round – the Coriolis effect',
      title: 'Throwing a ball on a merry-go-round',
      lede: 'A person stands at the edge of a rotating wheel (radius 5 m) and rolls a ball straight towards the centre. Seen from the ground, the ball moves in a straight line. Seen from the wheel, the path curves, because the wheel turns underneath the ball while it travels.',
      gTag: 'Inertial frame', gTitle: 'Seen from the ground', gAria: 'The wheel seen from above, from the ground. The wheel rotates and the ball moves in a straight line.',
      wTag: 'Rotating frame', wTitle: 'Seen from the wheel', wAria: 'The wheel seen by someone standing on it. The wheel is still and the ball’s trace curves.',
      legPath: 'Ball’s path over the ground', legTraceRot: 'Trace on the wheel (rotates with it)', legTrace: 'Trace on the wheel', legAim: 'Thrower’s line of aim',
      settings: 'Settings', readings: 'Readings',
      omegaL: 'Angular velocity ω', omegaH: 'Positive means anticlockwise. Changes apply from the next throw.',
      ccw: 'anticlockwise', cw: 'clockwise', still: 'at rest',
      speedL: 'Throw speed relative to the wheel',
      aimL: 'Aim angle', aimH: '0° points straight at the centre. Try aiming so the ball hits the centre.',
      left: 'left', right: 'right', straight: 'straight',
      slowL: 'Playback speed', keep: 'Keep earlier traces',
      throw: 'Throw the ball', pause: 'Pause', resume: 'Resume', clear: 'Clear traces',
      rT: 'Time since throw', rV: 'Ball’s speed over the ground', rRim: 'Rim speed ωR', rCor: 'Coriolis force per kg, 2ωv', rMiss: 'Closest distance to centre',
      explain: 'When the ball is released it carries both the inward throw speed and the sideways speed of the rim (<b>ωR</b>). Over the ground it therefore travels in a straight, slanted line. Seen from the wheel, it looks as if a sideways force, the <b>Coriolis force</b>, bends the path. It acts towards the thrower’s right when the wheel turns anticlockwise, as in the Northern Hemisphere.',
      by: 'Made by Geir Lislebo', lic: 'Licence:', licUrl: 'https://creativecommons.org/licenses/by/4.0/',
      dec: '.'
    }
  };

  const R = 5;
  const $ = id => document.getElementById(id);
  const cvG = $('cvGround'), cvW = $('cvWheel');
  const ctxG = cvG.getContext('2d'), ctxW = cvW.getContext('2d');

  let lang = 'nb';
  try {
    const q = new URLSearchParams(location.search).get('lang');
    const saved = localStorage.getItem('karusell-lang');
    if (q === 'en' || q === 'nb') lang = q;
    else if (saved === 'en' || saved === 'nb') lang = saved;
    else if (!/^(nb|nn|no)\b/i.test(navigator.language || 'nb')) lang = 'en';
  } catch (e) {}
  const t = k => T[lang][k];
  const fmt = (x, d=2) => x.toFixed(d).replace('.', t('dec')).replace('-', '−');

  const S = { theta: 0, omega: +$('omega').value, paused: false, throws: [], active: null };

  function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function makeThrow(){
    const omega = +$('omega').value, v = +$('speed').value, aim = +$('aim').value * Math.PI/180;
    S.omega = omega;
    const th0 = S.theta;
    const p0 = [R*Math.cos(th0), R*Math.sin(th0)];
    const inward = th0 + Math.PI + aim;             // positiv sikte = kasterens venstre
    const vr = [v*Math.cos(inward), v*Math.sin(inward)];
    const u = [vr[0] - omega*p0[1], vr[1] + omega*p0[0]];   // + ω × r
    const speed = Math.hypot(u[0], u[1]);
    const miss = Math.abs(p0[0]*u[1] - p0[1]*u[0]) / speed;
    return { p0, u, t: 0, done: false, ground: [p0.slice()], local: [], miss, speed };
  }

  function toWheel(p, theta){
    const c = Math.cos(-theta), s = Math.sin(-theta);
    return [c*p[0] - s*p[1], s*p[0] + c*p[1]];
  }

  function step(dt){
    S.theta += S.omega*dt;
    const a = S.active;
    if (!a || a.done) return;
    a.t += dt;
    const p = [a.p0[0] + a.u[0]*a.t, a.p0[1] + a.u[1]*a.t];
    a.ground.push(p);
    a.local.push(toWheel(p, S.theta));
    a.pos = p;
    if (Math.hypot(p[0], p[1]) > R*1.25 || a.t > 30) a.done = true;
  }

  function setupCanvas(cv, ctx){
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth;
    if (cv.width !== Math.round(w*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(w*dpr); }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    const s = cv.width / (2*R*1.3);
    ctx.setTransform(s,0,0,-s,cv.width/2,cv.height/2);
    return 1/s;
  }

  function drawWheel(ctx, rot, px){
    ctx.save();
    ctx.fillStyle = css('--wheel'); ctx.strokeStyle = css('--wheel-edge');
    ctx.lineWidth = 2.5*px;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = css('--spoke'); ctx.lineWidth = 1.2*px;
    for (let r=1; r<R; r++){ ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke(); }
    for (let k=0;k<12;k++){
      const a = rot + k*Math.PI/6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(R*Math.cos(a), R*Math.sin(a)); ctx.stroke();
    }
    ctx.strokeStyle = css('--wheel-edge'); ctx.lineWidth = 1.5*px;
    for (let k=0;k<36;k++){
      const a = rot + k*Math.PI/18, r1 = k%3===0 ? R-0.3 : R-0.15;
      ctx.beginPath(); ctx.moveTo(r1*Math.cos(a), r1*Math.sin(a)); ctx.lineTo(R*Math.cos(a), R*Math.sin(a)); ctx.stroke();
    }
    ctx.fillStyle = css('--fg');
    ctx.beginPath(); ctx.arc(0,0,4*px,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = css('--fg'); ctx.lineWidth = 1*px;
    ctx.beginPath(); ctx.arc(0,0,0.35,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc((R+0.35)*Math.cos(rot),(R+0.35)*Math.sin(rot),0.28,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function polyline(ctx, pts, color, w, px, rot=0, dash=null, alpha=1){
    if (pts.length < 2) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.rotate(rot);
    ctx.strokeStyle = color; ctx.lineWidth = w*px; ctx.lineJoin = 'round'; ctx.lineCap='round';
    if (dash) ctx.setLineDash(dash.map(d=>d*px));
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke(); ctx.restore();
  }

  function ball(ctx, p, px){
    ctx.save();
    ctx.fillStyle = css('--ball'); ctx.strokeStyle = css('--ball-edge'); ctx.lineWidth = 1.5*px;
    ctx.beginPath(); ctx.arc(p[0], p[1], 0.22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function draw(){
    const cG = css('--ground'), cW = css('--onwheel');
    const aimRad = +$('aim').value*Math.PI/180;

    let px = setupCanvas(cvG, ctxG);
    drawWheel(ctxG, S.theta, px);
    // sporene på hjulet beholdes; banen over bakken vises bare for siste kast
    S.throws.forEach(tr => {
      const cur = tr === S.active;
      polyline(ctxG, tr.local, cW, cur ? 2.6 : 1.6, px, S.theta);
      if (cur) polyline(ctxG, tr.ground, cG, 2.4, px);
    });
    if (S.active && S.active.pos && !S.active.done) ball(ctxG, S.active.pos, px);

    px = setupCanvas(cvW, ctxW);
    drawWheel(ctxW, 0, px);
    polyline(ctxW, [[R,0],[R - 2*R*Math.cos(aimRad), -2*R*Math.sin(aimRad)]], cG, 1.4, px, 0, [6,5]);
    S.throws.forEach(tr => polyline(ctxW, tr.local, cW, tr === S.active ? 2.6 : 1.6, px));
    if (S.active && S.active.local.length && !S.active.done) ball(ctxW, S.active.local[S.active.local.length-1], px);

    const a = S.active;
    $('rT').textContent = fmt(a ? a.t : 0) + ' s';
    $('rV').textContent = a ? fmt(a.speed) + ' m/s' : '–';
    $('rRim').textContent = fmt(Math.abs(+$('omega').value)*R) + ' m/s';
    $('rCor').textContent = fmt(2*Math.abs(+$('omega').value)*(+$('speed').value)) + ' m/s²';
    $('rMiss').textContent = a ? fmt(a.miss) + ' m' : '–';
  }

  function throwBall(){
    if (!$('keep').checked) S.throws = [];
    S.theta = S.theta % (2*Math.PI);
    const tr = makeThrow();
    tr.local = [toWheel(tr.p0, S.theta)];
    S.throws.push(tr); S.active = tr;
    if (S.throws.length > 8) S.throws.shift();
    S.paused = false; syncPause();
  }

  function syncPause(){ $('pauseBtn').textContent = S.paused ? t('resume') : t('pause'); }

  function syncOutputs(){
    const w = +$('omega').value, aim = +$('aim').value;
    $('omegaOut').textContent = fmt(w) + ' rad/s · ' + (w > 0 ? t('ccw') : w < 0 ? t('cw') : t('still'));
    $('speedOut').textContent = fmt(+$('speed').value,1) + ' m/s';
    $('aimOut').textContent = aim === 0 ? '0° · ' + t('straight') : Math.abs(aim) + '° ' + (aim > 0 ? t('left') : t('right'));
    $('slowOut').textContent = fmt(+$('slow').value) + '×';
  }

  function applyLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    $('licLink').href = t('licUrl');
    $('langNb').setAttribute('aria-pressed', l === 'nb');
    $('langEn').setAttribute('aria-pressed', l === 'en');
    syncOutputs(); syncPause();
    try { localStorage.setItem('karusell-lang', l); } catch (e) {}
  }
  $('langNb').addEventListener('click', () => applyLang('nb'));
  $('langEn').addEventListener('click', () => applyLang('en'));

  ['omega','speed','aim','slow'].forEach(id => $(id).addEventListener('input', () => {
    syncOutputs();
    if (id === 'omega' && (!S.active || S.active.done)) S.omega = +$('omega').value;
  }));
  $('throwBtn').addEventListener('click', throwBall);
  $('pauseBtn').addEventListener('click', () => { S.paused = !S.paused; syncPause(); });
  $('clearBtn').addEventListener('click', () => { S.throws = []; S.active = null; });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now();
  function loop(now){
    let dt = Math.min(0.05, (now-last)/1000); last = now;
    if (!S.paused){
      dt *= +$('slow').value * (reduce ? 0.5 : 1);
      for (let i=0;i<4;i++) step(dt/4);
    }
    draw();
    requestAnimationFrame(loop);
  }

  applyLang(lang);
  S.theta = 0;
  throwBall();
  for (let i=0;i<2000 && !S.active.done;i++) step(0.01);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
